<app-travel-nav id="top" />
<main>
  <section class="hero" aria-labelledby="travel-hero-title">
    <div class="hero__slides">
      <owl-carousel-o appAccessibleCarousel #heroCarousel [options]="heroOptions()" (initialized)="slideChanged($event)" (changed)="slideChanged($event)">
        @for (photo of heroImages; track photo.id; let first = $first) {
          <ng-template carouselSlide [id]="photo.id">
            <img class="hero__photo" [src]="photo.image" [alt]="photo.alt | t" width="1920" height="1080" [attr.fetchpriority]="first ? 'high' : 'low'" [loading]="first ? 'eager' : 'lazy'" />
          </ng-template>
        }
      </owl-carousel-o>
    </div>
    <div class="hero__wash" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__kicker">{{ 'travel.heroKicker' | t }}</span>
      <h1 id="travel-hero-title">{{ 'travel.heroTitle' | t }}<br>{{ 'travel.heroAccent' | t }}</h1>
      <div class="hero__actions">
        <a class="section-button" href="#catalog">{{ 'siteCopy.exploreTours' | t }} <span aria-hidden="true">↗</span></a>
        <a class="hero__link" href="#booking">{{ 'siteCopy.planYourTrip' | t }} <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <div class="container hero__bottom">
      <div class="hero__pagination" [attr.aria-label]="'carousel.chooseSlide' | t">
        @for (photo of heroImages; track photo.id; let index = $index) {
          <button type="button" (click)="heroCarousel.to(photo.id)" [class.is-active]="activeSlide() === index" [attr.aria-current]="activeSlide() === index ? 'true' : null" [attr.aria-label]="('carousel.slide' | t) + ' ' + (index + 1)"><span>0{{ index + 1 }}</span></button>
        }
      </div>
      <div class="carousel-controls carousel-controls--light">
        <button type="button" (click)="heroCarousel.prev()" [attr.aria-label]="'carousel.previous' | t"><span aria-hidden="true">←</span></button>
        <button type="button" (click)="heroCarousel.next()" [attr.aria-label]="'carousel.next' | t"><span aria-hidden="true">→</span></button>
      </div>
    </div>
  </section>
  <app-tour-categories-section />
  <app-why-choose-us-section />
  <app-signature-tours-section />
  <app-plan-tour-cta-section />
  <app-luxury-gallery-section />
</main>
