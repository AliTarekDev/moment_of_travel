<section class="why-luxury" id="services" aria-labelledby="why-ancient-paths-heading">
  <div class="container why-luxury__heading">
    <span class="eyebrow">{{ 'siteCopy.ourDifference' | t }}</span>
    <h2 id="why-ancient-paths-heading">{{ 'whyAncientPaths.title' | t }}</h2>
    <p>{{ 'whyAncientPaths.introduction' | t }}</p>
  </div>
  <div class="experience-list">
    @for (experience of experiences; track experience.id; let reverse = $odd) {
      <article class="experience" [class.experience--reverse]="reverse" [id]="experience.id">
        <img class="experience__image" [src]="experience.image" [alt]="experience.alt | t" width="900" height="1000" loading="lazy" />
        <div class="experience__copy">
          <span class="experience__number" aria-hidden="true">0{{ $index + 1 }}</span>
          <h3>{{ experience.title | t }}</h3>
          <p>{{ experience.text | t }}</p>
          <a class="section-button" [routerLink]="'/' + languages.language() + '/' + experience.route">{{ 'siteCopy.seeDetails' | t }}<span aria-hidden="true">↗</span></a>
        </div>
      </article>
    }
  </div>
</section>
