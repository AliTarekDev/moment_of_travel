@if (images().length) {
  <section class="luxury-gallery">
    <div class="container">
      <div class="luxury-gallery__heading">
        <span class="eyebrow">{{ 'siteCopy.makeYourJourneyMoreBeautiful' | t }}</span>
        <h2>{{ heading() || ('siteCopy.aLittleInspirationForTheRoad' | t) }}</h2>
      </div>
      <div class="gallery-slider" role="region" [attr.aria-label]="heading() || ('siteCopy.aLittleInspirationForTheRoad' | t)">
        <owl-carousel-o appAccessibleCarousel #gallery [options]="carouselOptions()">
          @for (image of images(); track image.image) {
            <ng-template carouselSlide [id]="image.image">
              <figure class="gallery-card">
                <img appImageFallback [src]="image.image" [alt]="image.caption || (image.titleKey! | t)" width="800" height="600" loading="lazy" />
                <figcaption>{{ image.caption || (image.locationKey! | t) }}</figcaption>
              </figure>
            </ng-template>
          }
        </owl-carousel-o>
        @if (images().length > 1) {
          <div class="gallery-controls carousel-controls">
            <button type="button" (click)="gallery.prev()" [attr.aria-label]="'gallery.previous' | t"><span aria-hidden="true">←</span></button>
            <button type="button" (click)="gallery.next()" [attr.aria-label]="'gallery.next' | t"><span aria-hidden="true">→</span></button>
          </div>
        }
      </div>
    </div>
  </section>
}
