<section class="luxury-gallery">
  <div class="container">
    <div class="luxury-gallery__heading"><span class="eyebrow">{{ ('siteCopy.makeYourJourneyMoreBeautiful' | t) }}</span><h2>{{ ('siteCopy.aLittleInspirationForTheRoad' | t) }}</h2></div>
    <div class="gallery-grid">@for (image of images; track image) {
      <figure class="gallery-card"><img [src]="image.image" [alt]="(image.titleKey | t)" loading="lazy" /><figcaption>{{ (image.locationKey | t) }}</figcaption></figure>
    }</div>
  </div>
</section>
