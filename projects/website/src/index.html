<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Ancient Paths — Discover the world your way</title>
    <meta
      name="description"
      content="Flights, stays and unforgettable travel experiences in one thoughtfully designed place."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/LOGO%202.png" />
    <style>
      html:has(#website-loader) { overflow: hidden; }
      #website-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f7f6f3;
        color: #5c3a58;
        font: 600 1rem/1.5 system-ui, sans-serif;
      }
      #website-loader::before {
        content: '';
        width: 36px;
        height: 36px;
        border: 2px solid #ded0dc;
        border-top-color: #5c3a58;
        border-radius: 50%;
        animation: website-loader-spin .8s linear infinite;
      }
      #website-loader[data-error]::before { display: none; }
      #website-loader a { color: inherit; }
      @keyframes website-loader-spin { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) {
        #website-loader::before { animation: none; }
      }
    </style>
    <noscript><style>#website-loader { display: none; } html:has(#website-loader) { overflow: auto; }</style></noscript>
  </head>
  <body>
    <div id="website-loader" role="status">
      <span id="website-loader-text">Loading Ancient Paths…</span>
      <a id="website-loader-retry" href="" hidden>Reload page</a>
    </div>
    <app-root></app-root>
  </body>
</html>
